name: Performance Tests

on:
  # Keep this workflow base-controlled. External PRs are rejected before any
  # self-hosted benchmark runner can be selected.
  pull_request_target:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      compare_upstream:
        type: boolean
        default: true
        description: Compare against upstream quinn
      publish_metrics:
        type: boolean
        default: false
        description: Publish metrics to perf.iroh.computer

concurrency:
  group: perf-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  RUSTFLAGS: -Dwarnings
  # Performance jobs are trusted-only, but keep the cache policy explicit.
  SCCACHE_GHA_ENABLED: >-
    ${{
      github.event_name != 'merge_group' &&
      ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') ||
        (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) &&
      'on' || ''
    }}
  RUSTC_WRAPPER: "sccache"
  PR_REPOSITORY: ${{ github.repository }}
  PR_REF: ${{ (github.event.pull_request.number && format('refs/pull/{0}/merge', github.event.pull_request.number)) || github.sha }}
  ALLOW_UNSAFE_PR_CHECKOUT: 'false'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.impl }} perf
    if: >-
      github.repository == 'manaflow-ai/noq' &&
      github.event_name != 'merge_group' &&
      (github.event_name != 'pull_request_target' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'))
    runs-on: >-
      ${{
        github.event_name == 'pull_request' && 'ubuntu-latest' ||
        fromJSON('["self-hosted","linux","X64"]')
      }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - impl: noq
            artifact: noq-perf
          - impl: upstream-quinn
            artifact: quinn-perf-upstream
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        if: matrix.impl == 'noq'
        with:
          repository: ${{ env.PR_REPOSITORY }}
          ref: ${{ env.PR_REF }}
          persist-credentials: false
          allow-unsafe-pr-checkout: ${{ env.ALLOW_UNSAFE_PR_CHECKOUT }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad

      - name: Get latest quinn release tag
        if: matrix.impl == 'upstream-quinn'
        id: quinn-release
        run: |
          LATEST_TAG=$(curl -s https://api.github.com/repos/quinn-rs/quinn/releases/latest | jq -r '.tag_name')
          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "Using upstream quinn release: $LATEST_TAG"

      - name: Clone upstream quinn
        if: matrix.impl == 'upstream-quinn'
        env:
          QUINN_TAG: ${{ steps.quinn-release.outputs.tag }}
        run: |
          if [[ -z "$QUINN_TAG" || "$QUINN_TAG" == -* ]] || ! git check-ref-format --branch "$QUINN_TAG"; then
            echo "Invalid quinn release tag: $QUINN_TAG" >&2
            exit 1
          fi
          rm -rf /tmp/upstream-quinn
          git clone --depth 1 --branch "$QUINN_TAG" \
            https://github.com/quinn-rs/quinn.git /tmp/upstream-quinn

      - name: Build perf binary
        run: cargo build --release -p perf --features json-output
        working-directory: ${{ matrix.impl == 'upstream-quinn' && '/tmp/upstream-quinn' || '.' }}

      - name: Upload binary
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.impl == 'upstream-quinn' && '/tmp/upstream-quinn/target/release/quinn-perf' || 'target/release/noq-perf' }}
          retention-days: 1

  raw-perf:
    name: Raw perf ${{ matrix.impl }}
    if: >-
      github.repository == 'manaflow-ai/noq' &&
      github.event_name != 'merge_group' &&
      (github.event_name != 'pull_request_target' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'))
    needs: build
    runs-on: >-
      ${{
        github.event_name == 'pull_request' && 'ubuntu-latest' ||
        fromJSON('["self-hosted","linux","X64"]')
      }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        impl: [noq, upstream-quinn]
        include:
          - impl: noq
            artifact: noq-perf
          - impl: upstream-quinn
            artifact: quinn-perf-upstream
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ env.PR_REPOSITORY }}
          ref: ${{ env.PR_REF }}
          persist-credentials: false
          allow-unsafe-pr-checkout: ${{ env.ALLOW_UNSAFE_PR_CHECKOUT }}

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: ${{ matrix.artifact }}
          path: ./bin

      - name: Run benchmarks
        env:
          PERF_IMPL: ${{ matrix.impl }}
        run: |
          PERF_BIN=$(ls ./bin/noq-perf ./bin/quinn-perf 2>/dev/null | head -1)
          chmod +x "$PERF_BIN"
          ./.github/scripts/run_perf.sh "$PERF_BIN" "results/$PERF_IMPL"

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: raw-results-${{ matrix.impl }}
          path: results/
          retention-days: 3

  netsim-perf:
    name: Netsim perf ${{ matrix.impl }}
    if: >-
      github.repository == 'manaflow-ai/noq' &&
      github.event_name != 'merge_group' &&
      github.event_name != 'pull_request' &&
      (github.event_name != 'pull_request_target' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'))
    needs: build
    runs-on: [self-hosted, linux, X64]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        impl: [noq, upstream-quinn]
        include:
          - impl: noq
            artifact: noq-perf
          - impl: upstream-quinn
            artifact: quinn-perf-upstream
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ env.PR_REPOSITORY }}
          ref: ${{ env.PR_REF }}
          persist-credentials: false
          allow-unsafe-pr-checkout: ${{ env.ALLOW_UNSAFE_PR_CHECKOUT }}

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: ${{ matrix.artifact }}
          path: ./bin

      - name: Fetch netsim
        run: |
          rm -rf /tmp/chuck
          git clone --depth 1 https://github.com/n0-computer/chuck.git /tmp/chuck

      - name: Install netsim deps
        run: |
          cd /tmp/chuck/netsim
          sudo apt-get update
          ./setup.sh || true
          ./cleanup.sh || true

      - name: Setup netsim bins
        run: |
          mkdir -p /tmp/chuck/netsim/bins
          if [ -f ./bin/noq-perf ]; then
            chmod +x ./bin/noq-perf
            cp ./bin/noq-perf /tmp/chuck/netsim/bins/noq-perf
          else
            chmod +x ./bin/quinn-perf
            cp ./bin/quinn-perf /tmp/chuck/netsim/bins/noq-perf
          fi

      - name: Run netsim perf test
        id: run_netsim
        continue-on-error: true
        env:
          PERF_IMPL: ${{ matrix.impl }}
        run: |
          ./.github/scripts/run_netsim_perf.sh "$PERF_IMPL" /tmp/chuck/netsim

      - name: Collect results
        if: always()
        env:
          PERF_IMPL: ${{ matrix.impl }}
        run: |
          mkdir -p "results/$PERF_IMPL"
          cp /tmp/chuck/netsim/report/*.json "results/$PERF_IMPL/" 2>/dev/null || true
          cp /tmp/chuck/netsim/logs/*.log "results/$PERF_IMPL/" 2>/dev/null || true

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: netsim-results-${{ matrix.impl }}
          path: results/
          retention-days: 3

      - name: Cleanup netsim
        if: always()
        run: |
          cd /tmp/chuck/netsim
          ./cleanup.sh || true

  compare:
    name: Compare results
    needs: [raw-perf, netsim-perf]
    if: >-
      always() &&
      github.repository == 'manaflow-ai/noq' &&
      github.event_name != 'pull_request' &&
      github.event_name != 'merge_group' &&
      (github.event_name != 'pull_request_target' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'))
    permissions:
      contents: read
      # The compare job posts the trusted benchmark report to the PR.
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ env.PR_REPOSITORY }}
          ref: ${{ env.PR_REF }}
          persist-credentials: false
          allow-unsafe-pr-checkout: ${{ env.ALLOW_UNSAFE_PR_CHECKOUT }}

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: raw-results-*
          merge-multiple: true
          path: raw-results/

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: netsim-results-*
          merge-multiple: true
          path: netsim-results/

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Generate comparison report
        id: compare
        run: |
          python .github/scripts/compare_results.py raw-results/ netsim-results/ > comparison.md
          echo "COMPARISON<<EOF" >> $GITHUB_OUTPUT
          cat comparison.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Convert to Metro format
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python .github/scripts/perf_to_metro.py raw-results/ netsim-results/ \
            --commit "$COMMIT_SHA" > metro.json

      - name: Show results
        run: |
          echo "=== Comparison Report ==="
          cat comparison.md
          echo ""
          echo "=== Metro Metrics ==="
          cat metro.json

      - name: Upload comparison report
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: perf-comparison-report
          path: |
            comparison.md
            metro.json
          retention-days: 7

      - name: Publish metrics to Metro
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          METRO_TOKEN: ${{ secrets.METRO_TOKEN }}
          METRO_ENDPOINT: ${{ secrets.METRO_ENDPOINT }}
        run: |
          if [[ -n "$METRO_TOKEN" && -n "$METRO_ENDPOINT" ]]; then
            curl -X POST \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $METRO_TOKEN" \
              --data @metro.json \
              "$METRO_ENDPOINT"
          else
            echo "Metro secrets not configured, skipping publish"
          fi

      - name: Find existing comment
        if: >-
          (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.login != 'dependabot[bot]'
        uses: peter-evans/find-comment@3eae4d37986fb5a8592848f6a574fdf654e61f9e
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- perf-report -->'

      - name: Create new PR comment
        if: >-
          (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          steps.find-comment.outputs.comment-id == ''
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            <!-- perf-report -->
            ## Performance Comparison Report

            <details>
            <summary><code>${{ github.event.pull_request.head.sha }}</code> - <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">artifacts</a></summary>

            ${{ steps.compare.outputs.COMPARISON }}

            </details>

      - name: Update existing PR comment
        if: >-
          (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          steps.find-comment.outputs.comment-id != ''
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          edit-mode: append
          body: |

            ---
            <details>
            <summary><code>${{ github.event.pull_request.head.sha }}</code> - <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">artifacts</a></summary>

            ${{ steps.compare.outputs.COMPARISON }}

            </details>
