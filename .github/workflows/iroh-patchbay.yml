name: iroh-patchbay

on:
  # Keep this workflow base-controlled. External PRs are rejected before the
  # self-hosted runner can be selected.
  pull_request_target:
    types: [opened, synchronize, reopened]
  merge_group:
  push:
    branches:
      - main

concurrency:
  group: iroh-patchbay-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  SCCACHE_CACHE_SIZE: "10G"
  IROH_FORCE_STAGING_RELAYS: "1"
  NEXTEST_VERSION: "0.9.80"
  PR_REPOSITORY: ${{ github.repository }}
  PR_REF: ${{ (github.event.pull_request.number && format('refs/pull/{0}/merge', github.event.pull_request.number)) || github.sha }}
  ALLOW_UNSAFE_PR_CHECKOUT: 'false'

permissions:
  contents: read

jobs:
  # Base-controlled hosted validation for fork PRs. The fork checkout is the
  # only reviewed unsafe-checkout exception, and this job has no secrets or
  # write permissions. The persistent runner job below remains trusted-only.
  fork_validation:
    name: iroh patchbay (hosted fork)
    if: >-
      github.repository == 'manaflow-ai/noq' &&
      github.event_name == 'pull_request_target' &&
      (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout noq pull request merge
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ github.repository }}
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          persist-credentials: false
          allow-unsafe-pr-checkout: true
          path: noq
      - name: Checkout iroh integration baseline
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: n0-computer/iroh
          ref: 00e016afed8aef4db05b43ef728d52eee140316f
          persist-credentials: false
          path: iroh
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - name: Install cargo-make and cargo-nextest
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf
        with:
          tool: nextest@0.9.80,cargo-make
      - name: Patch noq crates in iroh workspace
        working-directory: iroh
        run: |
          mv Cargo.toml Cargo.toml.in
          awk 'BEGIN { in_patch = 0 }; /\[patch\.crates-io\]/ { in_patch = 1 }; !in_patch { print }' Cargo.toml.in > Cargo.toml
          cat >> Cargo.toml <<'EOF'

          [patch.crates-io]
          noq = { path = "../noq/noq" }
          noq-proto = { path = "../noq/noq-proto" }
          noq-udp = { path = "../noq/noq-udp" }
          EOF
      - name: Build and run patchbay tests
        working-directory: iroh
        run: |
          cargo make patchbay --no-run
          cargo make patchbay

  iroh_patchbay:
    name: iroh patchbay
    timeout-minutes: 30
    if: >-
      github.repository == 'manaflow-ai/noq' &&
      github.event_name != 'merge_group' &&
      (github.event_name != 'pull_request_target' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'))
    runs-on: >-
      ${{
        github.event_name == 'pull_request' && 'ubuntu-latest' ||
        fromJSON('["self-hosted","linux","X64"]')
      }}
    env:
      RUSTC_WRAPPER: "sccache"
    steps:
      - name: Enable unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        continue-on-error: true

      - name: Checkout noq
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ env.PR_REPOSITORY }}
          ref: ${{ env.PR_REF }}
          persist-credentials: false
          allow-unsafe-pr-checkout: ${{ env.ALLOW_UNSAFE_PR_CHECKOUT }}
          path: noq

      - name: Checkout iroh
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: n0-computer/iroh
          # Pin the integration dependency to the reviewed main snapshot.
          # Update this SHA deliberately when the upstream baseline changes.
          ref: 00e016afed8aef4db05b43ef728d52eee140316f
          persist-credentials: false
          path: iroh

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad
      - name: Install cargo-make and cargo-nextest
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf
        with:
          tool: nextest@${{ env.NEXTEST_VERSION }},cargo-make

      - name: Patch noq crates in iroh workspace
        working-directory: iroh
        run: |
          # Delete any pre-existing trailing patch section. This
          # assumes the patch section is trailing and the only reason
          # there would be any patch is because of noq. Could be
          # smarter.
          mv Cargo.toml Cargo.toml.in
          awk 'BEGIN { in_patch = 0 }; /\[patch\.crates-io\]/ { in_patch = 1 }; !in_patch { print }' Cargo.toml.in > Cargo.toml

          # Add our own patch section.
          cat >> Cargo.toml <<'EOF'

          [patch.crates-io]
          noq = { path = "../noq/noq" }
          noq-proto = { path = "../noq/noq-proto" }
          noq-udp = { path = "../noq/noq-udp" }
          EOF

      - name: Build patchbay tests
        working-directory: iroh
        run: cargo make patchbay --no-run

      - name: Run patchbay tests
        working-directory: iroh
        run: |
          set -o pipefail
          cargo make patchbay 2>&1 | tee "$RUNNER_TEMP/logs.txt"
        env:
          PATCHBAY_LOG: ${{ runner.debug && 'trace' || 'debug' }}
          RUST_LOG: ${{ runner.debug && 'trace' || 'debug' }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: iroh-patchbay-testdir-${{ github.sha }}
          path: |
            iroh/target/testdir-*/
            ${{ runner.temp }}/logs.txt
          retention-days: 7
          if-no-files-found: ignore
