name: Wine Tests

on:
  # Pull-request checks use a fresh hosted runner and PR cache scope. The
  # target event below is the base-controlled lane for trusted PRs.
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: wine-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: -Dwarnings
  PR_REPOSITORY: ${{ github.repository }}
  PR_REF: ${{ (github.event.pull_request.number && format('refs/pull/{0}/merge', github.event.pull_request.number)) || github.sha }}
  ALLOW_UNSAFE_PR_CHECKOUT: 'false'

permissions:
  contents: read

jobs:
  wine_test:
    name: Wine Sanity Check
    if: >-
      github.repository == 'manaflow-ai/noq' &&
      github.event_name != 'merge_group' &&
      (github.event_name != 'pull_request_target' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'))
    runs-on: >-
      ${{
        github.event_name == 'pull_request' && 'ubuntu-latest' ||
        fromJSON('["self-hosted","linux","X64"]')
      }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ env.PR_REPOSITORY }}
          ref: ${{ env.PR_REF }}
          persist-credentials: false
          allow-unsafe-pr-checkout: ${{ env.ALLOW_UNSAFE_PR_CHECKOUT }}

      - name: Install Wine
        run: |
          # Use WineHQ for newer Wine with bcryptprimitives.dll support
          sudo dpkg --add-architecture i386
          sudo mkdir -pm755 /etc/apt/keyrings
          sudo wget -O /etc/apt/keyrings/winehq-archive.key https://dl.winehq.org/wine-builds/winehq.key
          sudo wget -NP /etc/apt/sources.list.d/ https://dl.winehq.org/wine-builds/ubuntu/dists/$(lsb_release -cs)/winehq-$(lsb_release -cs).sources
          sudo apt-get update
          sudo apt-get install -y --install-recommends winehq-stable || sudo apt-get install -y wine64 wine32
          # Initialize Wine prefix
          WINEARCH=win64 wineboot --init

      - name: Install Rust + mingw target
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          targets: x86_64-pc-windows-gnu

      - name: Install mingw-w64
        run: sudo apt-get install -y mingw-w64

      - name: Build tests
        # Release mode required - debug builds exceed mingw's export ordinal limit (~65k symbols)
        run: cargo build --target x86_64-pc-windows-gnu --tests --release

      - name: List available tests
        run: |
          for exe in target/x86_64-pc-windows-gnu/release/deps/*.exe; do
            echo "=== Tests in $exe ==="
            wine "$exe" --list
          done

      - name: Run tests under Wine
        run: |
          for exe in target/x86_64-pc-windows-gnu/release/deps/*.exe; do
            echo "=== Running $exe ==="
            wine "$exe" --test-threads=1
          done
