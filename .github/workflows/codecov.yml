name: Coverage

on:
  # Pull-request checks stay on the PR merge commit and isolated cache scope.
  pull_request:
  # The target trigger is base-controlled and only runs the trusted upload
  # lane below.
  pull_request_target:
  push:
    branches: ['main']

# Coverage runs PR code only on a hosted runner with a read-only token. The
# target event skips fork and Dependabot code before checkout.

permissions: {}

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    if: >-
      github.repository == 'manaflow-ai/noq' &&
      (github.event_name != 'pull_request_target' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'))
    permissions:
      contents: read
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ github.repository }}
          ref: ${{ (github.event.pull_request.number && format('refs/pull/{0}/merge', github.event.pull_request.number)) || github.sha }}
          persist-credentials: false
          allow-unsafe-pr-checkout: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: taiki-e/install-action@ea647c55f74bb153499600c054578c0d83fa19d5
      - shell: bash
        # Run llvm-cov _without_ the "aws-lc-rs-fips" feature, since
        # that has complex build requirements:
        #     https://github.com/aws/aws-lc/blob/3263ce2a553e4e917217fb487f8c6f488fcb1866/BUILDING.md#build-prerequisites
        #
        # This list of features was determined using:
        #     cargo metadata --format-version 1 --no-deps \
        #       | jq -r ' .packages[].features | keys[]' \
        #       | sort -u \
        #       | grep -vFx -e 'default' -e 'aws-lc-rs-fips' \
        #       | paste -sd ',' -
        run: |
          cargo llvm-cov \
            --features="arbitrary,aws-lc-rs,bloom,fast-apple-datapath,futures-io,json-output,lock_tracking,log,platform-verifier,qlog,ring,runtime-smol,runtime-tokio,rustls,rustls-log,rustls,ring,serde,serde_json,tracing,tracing-log" \
            --workspace --lcov --output-path lcov.info
      - name: Upload coverage to Codecov
        if: >-
          github.repository == 'manaflow-ai/noq' &&
          (github.event_name == 'push' || github.event_name == 'pull_request_target') &&
          (github.event_name != 'pull_request_target' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'))
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false
